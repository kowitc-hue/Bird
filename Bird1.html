<!DOCTYPE html>
<html lang="th">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR 4 Parrots - Hiro Marker</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- A-Frame Extras (สำหรับเล่น Animation กระพือปีกของ 3D Model) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
      #ui-container {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 20px;
        border-radius: 30px;
        backdrop-filter: blur(5px);
      }
      .btn {
        background-color: #4CAF50;
        border: none;
        color: white;
        padding: 10px 18px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 20px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.1s;
      }
      .btn:active {
        transform: scale(0.92);
      }
      .btn-decrease {
        background-color: #f44336;
      }
      #speed-display {
        color: white;
        font-family: sans-serif;
        font-size: 15px;
        font-weight: bold;
        min-width: 90px;
        text-align: center;
      }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <!-- UI ปรับความเร็ว -->
    <div id="ui-container">
      <button class="btn btn-decrease" onclick="adjustSpeed(-50)">- ลดความเร็ว</button>
      <span id="speed-display">ความเร็ว: 1.0x</span>
      <button class="btn" onclick="adjustSpeed(50)">+ เพิ่มความเร็ว</button>
    </div>

    <script>
      let currentSpeed = 150; // ความเร็วเริ่มต้น (องศาต่อวินาที)
      const baseSpeed = 150;

      // Custom Component สำหรับหมุนกลุ่มนกแก้วเป็นวงกลม
      AFRAME.registerComponent('flying-group', {
        tick: function (t, dt) {
          if (!dt) return;
          let rot = this.el.getAttribute('rotation');
          rot.y = (rot.y + (currentSpeed * dt) / 1000) % 360;
          this.el.setAttribute('rotation', rot);
        }
      });

      // ฟังก์ชันปรับค่าความเร็วผ่านปุ่ม UI
      function adjustSpeed(delta) {
        currentSpeed = Math.max(30, currentSpeed + delta);
        let multiplier = (currentSpeed / baseSpeed).toFixed(1);
        document.getElementById('speed-display').innerText = `ความเร็ว: ${multiplier}x`;
      }
    </script>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <!-- โหลด 3D Model นกแก้ว -->
        <a-asset-item id="parrotModel" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/Parrot.glb"></a-asset-item>
      </a-assets>

      <!-- ตรวจจับ Hiro Marker -->
      <a-marker preset="hiro">
        <!-- กลุ่มที่ใช้ควบคุมการหมุนวนรอบ Marker -->
        <a-entity id="parrot-ring" flying-group>
          <!-- นกแก้วตัวที่ 1 (ทิศเหนือ) -->
          <a-entity gltf-model="#parrotModel" animation-mixer position="0 0.5 -1.5" scale="0.008 0.008 0.008" rotation="0 90 0"></a-entity>
          
          <!-- นกแก้วตัวที่ 2 (ทิศตะวันออก) -->
          <a-entity gltf-model="#parrotModel" animation-mixer position="1.5 0.5 0" scale="0.008 0.008 0.008" rotation="0 0 0"></a-entity>
          
          <!-- นกแก้วตัวที่ 3 (ทิศใต้) -->
          <a-entity gltf-model="#parrotModel" animation-mixer position="0 0.5 1.5" scale="0.008 0.008 0.008" rotation="0 -90 0"></a-entity>
          
          <!-- นกแก้วตัวที่ 4 (ทิศตะวันตก) -->
          <a-entity gltf-model="#parrotModel" animation-mixer position="-1.5 0.5 0" scale="0.008 0.008 0.008" rotation="0 180 0"></a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
